# タグから下書きのリリースまでを作る自動ビルド（ReleaseWorkflow）
# バージョンのタグ（本番の vX.Y.Z、試験用の vX.Y.Z-test.N）の push を契機に、次を順に行う。
#   1. タグと csproj の版の一致の確認（試験用のタグは - より前を比べる）
#   2. ビルドとテスト（CiWorkflow と同じ手順）
#   3. 2形態の発行と、発行した exe の版の文字列（ProductVersion）が X.Y.Z の形であることの確認
#   4. 2つの exe の起動確認
#   5. 配布用の zip を2つ作る
#   6. 2つの zip を添えた下書きのリリースを作る（同じタグのリリースが既にあれば失敗させる）
# どこかで失敗したら以降の手順は走らず、下書きは作らない（要件 5.1〜5.4、6.3、2.6）。
# リリースの公開（下書きの解除）はしない。公開は人が GitHub の画面で行う（要件 5.4）。
# 手動実行（workflow_dispatch）は既定のブランチに定義が無いと使えないため、契機にしない。
name: Release

on:
  push:
    tags:
      - 'v*'

# ワークフロー全体では権限を与えず、下書きを作るジョブにだけ必要な権限を与える
permissions: {}

env:
  # dotnet CLI と Microsoft Testing Platform の利用統計の送信を止める
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

defaults:
  run:
    shell: pwsh

jobs:
  release:
    name: 発行・起動確認・下書きのリリース
    runs-on: windows-2025
    permissions:
      # 下書きのリリースの作成と zip の添付に必要な最小の権限（他の権限は与えない）
      contents: write
    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@v7
        with:
          # 書き込みできるトークンを git の設定に残さない（ビルドとテストの間に触れられないように）
          persist-credentials: false

      # タグは vX.Y.Z（本番）か vX.Y.Z-test.N（試験用）の形だけを受け付け、
      # X.Y.Z（試験用は - より前）と csproj の <Version> が一致することを確かめる
      - name: タグと版の一致を確かめる
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG
          $m = [regex]::Match($tag, '^v(\d+\.\d+\.\d+)(-test\.\d+)?$')
          if (-not $m.Success) {
            Write-Output "::error::エラー: タグ '$tag' は vX.Y.Z か vX.Y.Z-test.N の形ではありません"
            exit 1
          }
          $tagVersion = $m.Groups[1].Value
          $isTest = $m.Groups[2].Success

          # csproj の <Version> を読む（1つだけであること、X.Y.Z の形であることを確かめる）
          [xml]$project = Get-Content -LiteralPath 'LargeFolderFinder.csproj' -Raw -Encoding UTF8
          $versions = @($project.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })
          if ($versions.Count -ne 1) {
            Write-Output "::error::エラー: LargeFolderFinder.csproj の <Version> が1つではありません（$($versions.Count) 個）"
            exit 1
          }
          $projectVersion = ([string]$versions[0]).Trim()
          if ($projectVersion -notmatch '^\d+\.\d+\.\d+$') {
            Write-Output "::error::エラー: LargeFolderFinder.csproj の <Version> '$projectVersion' は X.Y.Z の形ではありません"
            exit 1
          }
          if ($tagVersion -ne $projectVersion) {
            Write-Output "::error::エラー: タグの版 '$tagVersion'（タグ '$tag'）と LargeFolderFinder.csproj の版 '$projectVersion' が一致しません"
            exit 1
          }

          if ($isTest) {
            Write-Output "試験用のタグです: $tag（版 $tagVersion。下書きのタイトルに試験の印を付けます）"
          } else {
            Write-Output "本番のタグです: $tag（版 $tagVersion）"
          }
          "version=$tagVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "is_test=$(if ($isTest) { 'true' } else { 'false' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: global.json に従って .NET SDK を入れる
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: 使う SDK の版を表示する
        run: dotnet --version

      - name: ソリューションをビルドする（警告は失敗として扱う）
        run: dotnet build LargeFolderFinder.sln -c Release -warnaserror

      # テストの中で2つの検証ツール（GoldenBaseline、LocalizationCheck）が走る
      - name: テストを実行する
        run: dotnet test --solution LargeFolderFinder.sln -c Release --no-build

      - name: 自己完結版を発行する
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build/Publish.ps1 -Form SelfContained

      - name: 軽量版（フレームワーク依存）を発行する
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build/Publish.ps1 -Form FrameworkDependent

      # 版の文字列にコミットハッシュなどの付加情報が付いていないこと（要件 2.6）
      - name: 発行した exe の版の文字列を確かめる
        env:
          EXPECTED_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          foreach ($form in @('SelfContained', 'FrameworkDependent')) {
            $exe = Join-Path 'artifacts/publish' (Join-Path $form 'LargeFolderFinder.exe')
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              Write-Output "::error::エラー: 発行した exe が見つかりません: $exe"
              $failed = $true
              continue
            }
            $productVersion = (Get-Item -LiteralPath $exe).VersionInfo.ProductVersion
            if ($productVersion -notmatch '^\d+\.\d+\.\d+$') {
              Write-Output "::error::エラー: $form の exe の版の文字列 '$productVersion' は X.Y.Z の形ではありません"
              $failed = $true
            } elseif ($productVersion -ne $env:EXPECTED_VERSION) {
              Write-Output "::error::エラー: $form の exe の版の文字列 '$productVersion' がタグの版 '$($env:EXPECTED_VERSION)' と一致しません"
              $failed = $true
            } else {
              Write-Output "$form の exe の版の文字列: $productVersion"
            }
          }
          if ($failed) { exit 1 }

      # 起動確認のスクリプトは待つ時間（既定 20 秒）で必ず終わるが、終了させたアプリが残って
      # 出力の取り込みが止まる場合に備え、手順ごとに時間の上限を設ける
      - name: 自己完結版の起動を確かめる
        timeout-minutes: 10
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build/Test-Launch.ps1 -ExePath artifacts/publish/SelfContained/LargeFolderFinder.exe

      - name: 軽量版の起動を確かめる
        timeout-minutes: 10
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build/Test-Launch.ps1 -ExePath artifacts/publish/FrameworkDependent/LargeFolderFinder.exe

      - name: 配布用の zip を2つ作る
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build/Package.ps1

      # 同じタグのリリース（下書きを含む）が既にあれば失敗させ、上書きしない。
      # 作成に失敗したときは、この手順で作りかけた下書きを消し、部分的なリリースを残さない
      - name: 下書きのリリースを作る
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IS_TEST: ${{ steps.tag.outputs.is_test }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:TAG

          # 下書きも含めて、同じタグのリリースが無いことを確かめる
          $existingTags = @(gh api --paginate "repos/$repo/releases" --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::エラー: 既存のリリースの一覧を取得できません（gh の終了コード $LASTEXITCODE）"
            exit 1
          }
          if ($existingTags -ccontains $tag) {
            Write-Output "::error::エラー: タグ '$tag' のリリース（下書きを含む）が既にあります。上書きしません"
            exit 1
          }

          if ($env:IS_TEST -eq 'true') {
            $title = "[TEST / 試験] $tag"
          } else {
            $title = $tag
          }

          # 下書きの説明（2つの配布物の違いの定型文）
          $notes = @'
          ## Downloads / ダウンロード

          | File | Runtime | Size |
          |---|---|---|
          | `LargeFolderFinder.zip` (recommended) | Not required (self-contained) | Large (exe about 140 MB) |
          | `LargeFolderFinder-FrameworkDependent.zip` | [.NET 10 Desktop Runtime (x64)](https://dotnet.microsoft.com/download/dotnet/10.0) required | Small (exe about 1 MB) |

          - If unsure, choose `LargeFolderFinder.zip`. It runs on Windows 10/11 (x64) without installing anything.
          - Choose `LargeFolderFinder-FrameworkDependent.zip` only if the .NET 10 Desktop Runtime is already installed and you prefer a smaller download.
          - Both contain the same files (exe, Config.txt, language files, Readme, licenses); only the exe differs.

          | ファイル | ランタイム | 大きさ |
          |---|---|---|
          | `LargeFolderFinder.zip`（おすすめ） | 導入不要（自己完結） | 大きい（exe が約140MB） |
          | `LargeFolderFinder-FrameworkDependent.zip` | [.NET 10 デスクトップ ランタイム（x64）](https://dotnet.microsoft.com/download/dotnet/10.0) が必要 | 小さい（exe が約1MB） |

          - 迷ったら `LargeFolderFinder.zip` を選んでください。Windows 10/11（x64）で、何も導入せずに動きます。
          - `LargeFolderFinder-FrameworkDependent.zip` は、.NET 10 デスクトップ ランタイムが導入済みで、小さいほうが良い場合に選んでください。
          - どちらも中身のファイル（exe、Config.txt、言語ファイル、Readme、ライセンス）は同じで、exe だけが違います。
          '@
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [System.IO.File]::WriteAllText($notesFile, $notes, (New-Object System.Text.UTF8Encoding $false))

          gh release create $tag `
            'artifacts/package/LargeFolderFinder.zip' `
            'artifacts/package/LargeFolderFinder-FrameworkDependent.zip' `
            --repo $repo --draft --verify-tag --title $title --notes-file $notesFile
          $createExit = $LASTEXITCODE
          if ($createExit -ne 0) {
            Write-Output "::error::エラー: 下書きのリリースを作れませんでした（gh の終了コード $createExit）。作りかけの下書きを消します"
            # 事前に同じタグのリリースが無いことを確かめているので、今あるそのタグの下書きはこの手順で作ったもの
            $drafts = @(gh api --paginate "repos/$repo/releases" --jq '.[] | select(.draft) | [.id, .tag_name] | @tsv')
            foreach ($line in $drafts) {
              $fields = ([string]$line).Split("`t")
              if ($fields.Count -eq 2 -and $fields[1] -ceq $tag) {
                gh api -X DELETE "repos/$repo/releases/$($fields[0])"
              }
            }
            exit 1
          }
          Write-Output "下書きのリリースを作りました: $title（公開は GitHub の画面で人が行います）"
